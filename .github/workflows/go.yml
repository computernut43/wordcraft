name: Go

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['**.go', 'go.mod', 'go.sum', '**/testdata/**', 'ATTRIBUTION.md', 'assets/**', 'crates/geom/**', 'crates/doc/**', 'crates/docx/**', '.github/workflows/go.yml']
  pull_request:
    paths: ['**.go', 'go.mod', 'go.sum', '**/testdata/**', 'ATTRIBUTION.md', 'assets/**', 'crates/geom/**', 'crates/doc/**', 'crates/docx/**', '.github/workflows/go.yml']

permissions:
  contents: read

env:
  # The frozen Rust app the Go port is compared with (MIGRATION.md §2, §8).
  RUST_BASELINE: 9b4b948c6ecf29401e01ad58626d3c1983b83770

jobs:
  gates:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # fmt, vet, nopanic, layers, assets, staticcheck, test, wasm, licences, vuln
      - run: go run ./tools/ci

  test:
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go run ./tools/ci test

  # A Linux download of the Go command line on every run: static binaries (no cgo) for x86-64
  # and ARM64, kept as workflow artifacts.
  linux-build:
    timeout-minutes: 15
    strategy:
      matrix:
        arch: [amd64, arm64]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Build
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: ${{ matrix.arch }}
        run: |
          mkdir -p dist
          go build -trimpath -ldflags="-s -w" -o dist/wordcraft-cli ./cmd/wordcraft-cli
          cp LICENSE-APACHE LICENSE-MIT NOTICE ATTRIBUTION.md dist/
      - name: Smoke test
        if: matrix.arch == 'amd64'
        run: |
          dist/wordcraft-cli commands | grep -q '^text.insert '
          printf '%s' '{"body":[{"kind":"para","text":"Hello world","runs":[{"len":11}]}]}' > in.json
          dist/wordcraft-cli run --file in.json --cmd 'select.text={"text":"world"}' --cmd 'format.bold={"value":true}' --save out.json
          grep -q '"bold": true' out.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wordcraft-cli-linux-${{ matrix.arch }}
          path: dist/
          retention-days: 30

  reference:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: dtolnay/rust-toolchain@stable
      - name: Check out the Rust baseline
        run: git worktree add "$RUNNER_TEMP/rust-baseline" "$RUST_BASELINE"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: ${{ runner.temp }}/rust-baseline
          key: rust-baseline-${{ env.RUST_BASELINE }}
      - name: Build the reference CLI
        working-directory: ${{ runner.temp }}/rust-baseline
        run: cargo build --release --locked -p wordcraft-cli
      - name: Build the geom, doc, XML and package references
        run: |
          cargo build --release --manifest-path internal/geom/testdata/rust-oracle/Cargo.toml
          cargo build --release --manifest-path internal/doc/testdata/rust-oracle/Cargo.toml
          cargo build --release --manifest-path internal/docx/testdata/xml-oracle/Cargo.toml
          cargo build --release --manifest-path internal/docx/testdata/package-oracle/Cargo.toml
      - name: Go tests against the reference
        env:
          WORDCRAFT_GEOM_RUST: ${{ github.workspace }}/internal/geom/testdata/rust-oracle/target/release/geom-oracle
          WORDCRAFT_DOC_RUST: ${{ github.workspace }}/internal/doc/testdata/rust-oracle/target/release/doc-oracle
          WORDCRAFT_PROPS_RUST: ${{ github.workspace }}/internal/doc/testdata/rust-oracle/target/release/props
          WORDCRAFT_PROPS_CASES: "100000"
          WORDCRAFT_CLI_SCRIPTS: "1000"
          WORDCRAFT_XML_RUST: ${{ github.workspace }}/internal/docx/testdata/xml-oracle/target/release/xml-oracle
          WORDCRAFT_XML_CASES: "200000"
          WORDCRAFT_PACKAGE_RUST: ${{ github.workspace }}/internal/docx/testdata/package-oracle/target/release/package-oracle
          WORDCRAFT_PACKAGE_CASES: "30000"
        run: |
          cli="$RUNNER_TEMP/rust-baseline/target/release/wordcraft-cli"
          sum="$(sha256sum "$cli" | cut -d' ' -f1)"
          export WORDCRAFT_RUST_CLI="$cli" WORDCRAFT_RUST_CLI_SHA256="$sum"
          go test -count=1 ./...
